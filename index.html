<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>人相食主题总库 · 正史中的人相食</title>
<meta name="description" content="以二十四史（含《清史稿》）为史料来源，搜集、整理与考辨正史中「人相食」相关记载的专题历史数据库：一库与二库合并后的主题总库。" />
<link rel="stylesheet" href="assets/app.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238c3a34'/%3E%3Ctext x='16' y='23' font-size='19' font-family='serif' fill='%23f7f4ef' text-anchor='middle'%3E食%3C/text%3E%3C/svg%3E" />
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <h1>正史中的人相食</h1>
    </div>
    <div class="grow"></div>
    <button class="btn ghost auxbtn" id="auxExcluded" title="检索命中而不符合收录标准的材料">排除材料</button>
    <button class="btn ghost auxbtn" id="auxAbout" title="数据库性质、底本状况与判定标准">资料说明</button>
    <button class="btn ghost simbtn" id="simToggle" title="在繁体原文下方显示机器转换的简体对照">简体对照</button>
  </div>
</header>

<nav class="nav">
  <div class="nav-in" id="nav"></div>
</nav>

<main>
  <!-- 总览 -->
  <section class="view" id="view-overview">
    <div class="stat-row" id="ovStats"></div>
    <div class="entry-grid" id="ovEntries"></div>
    <div class="ov-cols">
      <div class="card" style="padding:18px 20px">
        <h3 class="sec-title">朝代分布 <small>点击进入事件名录</small></h3>
        <div class="bars two" id="ovBars"></div>
      </div>
      <div class="card" style="padding:18px 20px">
        <h3 class="sec-title">事件类型 <small>依现有判定字段</small></h3>
        <div class="bars" id="ovTypes"></div>
      </div>
    </div>

    <div class="card" style="padding:18px 20px;margin-top:22px">
      <h3 class="sec-title">史书分布 <small>25 部正史（二十四史＋清史稿）</small></h3>
      <div class="book-wrap">
        <div class="book-pie" id="ovBookPie"></div>
        <div class="book-side">
          <div class="book-detail" id="ovBookDetail"></div>
          <div class="book-legend" id="ovBookLegend"></div>
          <div class="book-zero" id="ovBookZero"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 事件名录 -->
  <section class="view" id="view-events">
    <div class="filters" id="filters"></div>
    <div class="split with-bar" id="evSplit">
      <div class="list-pane">
        <div class="list-head"><span id="listCount">—</span><span id="listSort"></span></div>
        <div class="list-body" id="evList"></div>
      </div>
      <div class="detail-pane">
        <div class="detail-head">
          <span class="who" id="detWho">未选择事件</span>
          <div class="nav-btns">
            <button class="btn ghost mobile-only" id="btnBackList">← 返回列表</button>
            <button class="btn ghost" id="btnPrev" title="上一事件">↑ 上一事件</button>
            <button class="btn ghost" id="btnNext" title="下一事件">↓ 下一事件</button>
            <button class="btn ghost" id="btnTop" title="回到详情顶部">回到顶部</button>
          </div>
        </div>
        <div class="detail-body" id="detBody"></div>
      </div>
    </div>
  </section>

  <!-- 时间轴 -->
  <section class="view" id="view-timeline">
    <div class="filters" id="filters2"></div>
    <div class="tl-wrap">
      <div class="tl-toolbar" id="tlToolbar"></div>
      <div class="tl-scroll" id="tlScroll"><div class="tl-inner" id="tlInner">
        <div class="tl-axis" id="tlAxis"></div>
        <div class="tl-plot" id="tlPlot"></div>
      </div></div>
      <div class="tl-legend" id="tlLegend"></div>
    </div>
    <div class="tl-unknown" id="tlUnknown"></div>
    <div style="margin-top:16px" class="card">
      <div class="list-head" style="border-radius:6px 6px 0 0"><span id="tlCount">—</span></div>
      <div id="tlList" style="max-height:420px;overflow:auto"></div>
    </div>
  </section>

  <!-- 地图 -->
  <section class="view" id="view-map">
    <div class="map-controls" id="mapControls"></div>
    <div class="map-main">
      <div class="map-stage" id="mapStage">
        <svg class="map-svg" id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="map-tip" id="mapTip"></div>
        <div class="map-tools">
          <button id="mapZoomIn" title="放大">＋</button>
          <button id="mapZoomOut" title="缩小">－</button>
          <button id="mapReset" title="复位">复位</button>
        </div>
        <div class="map-legend" id="mapLegend"></div>
        <div class="map-scale" id="mapScale"></div>
        <div class="map-note">底图：Natural Earth 地形晕渲与水系（公有领域），墨卡托投影；不含国界、省界与历史疆域。点位为史料地名的近似定位。</div>
      </div>
      <aside class="map-detail" id="mapDetail"></aside>
    </div>
  </section>

  <!-- 地点索引 -->
  <section class="view" id="view-places">
    <div class="filters" style="box-shadow:none">
      <div class="f-row">
        <div class="search-box">
          <input id="placeQ" type="search" placeholder="输入地名、今地或相关事件，按回车或点「搜索」" autocomplete="off" />
          <button class="clr" id="placeQClr" aria-label="清空">×</button>
        </div>
        <button class="btn primary" id="placeSearch">搜索</button>
        <span class="f-summary" id="placeCount"></span>
      </div>
    </div>
    <div id="placeBody"></div>
  </section>

  <!-- 人物索引 -->
  <section class="view" id="view-persons">
    <div class="filters" style="box-shadow:none">
      <div class="f-row">
        <div class="search-box">
          <input id="personQ" type="search" placeholder="输入人物姓名或所属事件，按回车或点「搜索」" autocomplete="off" />
          <button class="clr" id="personQClr" aria-label="清空">×</button>
        </div>
        <button class="btn primary" id="personSearch">搜索</button>
        <span class="f-summary" id="personCount"></span>
      </div>
    </div>
    <div id="personBody"></div>
  </section>

  <!-- 排除材料 -->
  <section class="view" id="view-excluded">
    <div class="filters" id="filters6"></div>
    <div class="mat-layout">
      <div class="mat-nav" id="exNav"></div>
      <div class="mat-list" id="exList"></div>
    </div>
  </section>

  <!-- 资料说明 -->
  <section class="view" id="view-about">
    <div class="doc" id="aboutBody"></div>
  </section>
</main>

<div class="reader" id="reader" hidden>
  <div class="reader-mask" id="readerMask"></div>
  <div class="reader-box" role="dialog" aria-modal="true" aria-label="整篇原文">
    <div class="reader-head">
      <div class="reader-title"><b id="readerTitle">整篇原文</b><span id="readerSub"></span></div>
      <div class="reader-actions">
        <button class="btn ghost" id="readerLocate">定位到命中处</button>
        <button class="btn" id="readerClose">关闭</button>
      </div>
    </div>
    <div class="reader-body" id="readerBody"></div>
  </div>
</div>

<div class="peek" id="peek" hidden>
  <div class="peek-mask" id="peekMask"></div>
  <div class="peek-box" role="dialog" aria-modal="true" aria-label="预览">
    <div class="peek-head">
      <div class="peek-title"><b id="peekTitle">预览</b><span id="peekSub"></span></div>
      <div class="peek-actions">
        <button class="btn ghost" id="peekClose">关闭</button>
        <button class="btn primary" id="peekGo">跳转至事件名录 →</button>
      </div>
    </div>
    <div class="peek-body" id="peekBody"></div>
  </div>
</div>

<footer class="foot" id="foot"></footer>

<script src="assets/texts/index.js"></script>
<script src="assets/data.js"></script>
<script src="assets/places.js"></script>
<script src="assets/basemap.js"></script>
<script src="assets/about.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
